server:
  port: 8082

spring:
  application:
    name: PRODUCT-SERVICE
  data:
    redis:
      host: localhost
      port: 6379
  datasource:
    url: jdbc:postgresql://localhost:5432/product_db
    username: postgres
    password: Hung266
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  sql:
    init:
      mode: always

logging:
  level:
    com.example.product: DEBUG